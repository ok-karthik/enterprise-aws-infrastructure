version: 0.1

# Infracost configuration for automating multi-project discovery
# This eliminates the need for complex Bash loops in GitHub Actions.

projects:
  - path: iac-live-repo/workloads/nonprod/workloads-dev
    name: dev
    include_all_paths: true
    exclude_paths:
      - "**/.terragrunt-cache/**"

  - path: iac-live-repo/workloads/prod/workloads-prod
    name: prod
    include_all_paths: true
    exclude_paths:
      - "**/.terragrunt-cache/**"
