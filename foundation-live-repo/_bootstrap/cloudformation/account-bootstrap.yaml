AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Day-0 bootstrap for one AWS account: the Terraform state bucket, the GitHub OIDC provider,
  and the two CI roles (github-actions-plan: read-only, github-actions-apply: admin capped by a
  permissions boundary). The management account deploys this as a plain stack
  (platform-bootstrap); member accounts get it through StackSets (PLAN 2.0b).

# No tags here on purpose: they come from the stack (--tags) and propagate to every resource.
# No Exports either: an export locks the exported resource against changes.

Parameters:
  GitHubRepo:
    Type: String
    Default: ok-karthik/enterprise-aws-infrastructure
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: GitHub repository (owner/name) allowed to assume the CI roles.
  GitHubEnvironment:
    Type: String
    AllowedPattern: '^[a-z0-9-]+$'
    Description: >-
      GitHub Environment whose jobs may assume github-actions-apply in this account
      (management, dev, prod, core, ...). The apply role trusts exactly this one.
  AllowOrganizationsAdmin:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" only in the management account, where the apply role has to manage AWS
      Organizations. Everywhere else the boundary denies organizations:* and account:*.
  AllowIdentityCenterAdmin:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" only in the management account, where the apply role has to manage IAM Identity Center
      (the identity-center stack). Everywhere else the boundary denies sso:*, sso-directory:* and
      identitystore:*. The StackSets never set this.
  NoncurrentVersionDays:
    Type: Number
    Default: 90
    MinValue: 30
    Description: Days before old (noncurrent) versions of state files are deleted.
  ReplicaRegion:
    Type: String
    Default: ""
    AllowedPattern: '^([a-z]{2}(-[a-z]+)+-[0-9])?$'
    Description: >-
      Optional (PLAN 7.2). Region whose state bucket (tg-state-<this account>-<region>, made by this same
      template there) receives a copy of every state file, for disaster recovery. Deploy the stack in
      that region FIRST, because the destination bucket must exist. Empty = no replication. Setting it to the stack's own region also means no replication.

Conditions:
  DenyOrganizations: !Equals [!Ref AllowOrganizationsAdmin, "false"]
  DenyIdentityCenter: !Equals [!Ref AllowIdentityCenterAdmin, "false"]
  # Replicate only when a replica region is set AND it is not this region (the replica region's own stack
  # gets the same parameter value from the StackSet and must not replicate to itself).
  # The replica region's stack (ReplicaRegion == its own region) is only a state bucket: the OIDC provider,
  # the boundary and the CI roles are global IAM and already exist from the primary region's stack.
  CreateGlobalResources: !Not [!Equals [!Ref ReplicaRegion, !Ref "AWS::Region"]]
  ReplicateState: !And
    - !Not [!Equals [!Ref ReplicaRegion, ""]]
    - !Not [!Equals [!Ref ReplicaRegion, !Ref "AWS::Region"]]

Resources:
  # ---------------------------------------------------------------------------
  # Terraform state bucket. Retained if the stack is ever deleted.
  # ---------------------------------------------------------------------------
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_145
            comment: >-
              SSE-S3 (AES256) for now. A customer-managed KMS key comes with PLAN 2.2, once the
              key and its policy can live in the account baseline.
          - id: CKV_AWS_18
            comment: >-
              Access logging needs a log-archive bucket, which does not exist yet (PLAN 4.1).
              Added in PLAN 2.2. State access is already recorded by CloudTrail.
    Properties:
      BucketName: !Sub "tg-state-${AWS::AccountId}-${AWS::Region}"
      ReplicationConfiguration: !If
        - ReplicateState
        - Role: !GetAtt StateReplicationRole.Arn
          Rules:
            - Id: state-to-secondary-region
              Status: Enabled
              Priority: 1
              Filter:
                Prefix: ""
              # A deleted state file is NOT deleted in the replica: the copy is the way back from a mistake.
              DeleteMarkerReplication:
                Status: Disabled
              Destination:
                Bucket: !Sub "arn:${AWS::Partition}:s3:::tg-state-${AWS::AccountId}-${ReplicaRegion}"
                StorageClass: STANDARD
        - !Ref AWS::NoValue
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionDays
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Lets S3 copy state files to the replica bucket (PLAN 7.2). Uses the bucket NAME, not !GetAtt, so the
  # role and the bucket do not depend on each other.
  StateReplicationRole:
    Type: AWS::IAM::Role
    Condition: ReplicateState
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: replicate-state
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetReplicationConfiguration", "s3:ListBucket"]
                Resource: !Sub "arn:${AWS::Partition}:s3:::tg-state-${AWS::AccountId}-${AWS::Region}"
              - Effect: Allow
                Action: ["s3:GetObjectVersionForReplication", "s3:GetObjectVersionAcl", "s3:GetObjectVersionTagging"]
                Resource: !Sub "arn:${AWS::Partition}:s3:::tg-state-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action: ["s3:ReplicateObject", "s3:ReplicateTags", "s3:ObjectOwnerOverrideToBucketOwner"]
                Resource: !Sub "arn:${AWS::Partition}:s3:::tg-state-${AWS::AccountId}-${ReplicaRegion}/*"

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: DenyOldTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"
            Condition:
              NumericLessThan:
                "s3:TlsVersion": 1.2

  # ---------------------------------------------------------------------------
  # GitHub OIDC provider. An account can have only ONE provider for this URL, so the stack
  # fails if one already exists (delete it or import it first).
  # ThumbprintList: optional in CloudFormation, and AWS validates GitHub's certificate against its
  # trusted CA library rather than a pinned thumbprint, so these values are belt and braces. They were
  # added to the live stack by hand; keep them in sync with GitHub's published thumbprints.
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGlobalResources
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c5876bd527751ce6668e91661cb0d2a4ddf9514

  # ---------------------------------------------------------------------------
  # Permissions boundary for github-actions-apply. The role carries AdministratorAccess (PLAN 3.4
  # narrows that), but a boundary caps what it can actually do. Names and ARNs are built with
  # !Sub from fixed names, never !Ref to a resource that depends on this policy (circular).
  # ---------------------------------------------------------------------------
  ApplyBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateGlobalResources
    Properties:
      ManagedPolicyName: github-actions-apply-boundary
      Description: >-
        Permissions boundary for github-actions-apply: blocks CloudTrail and CI-identity changes, protects
        this bootstrap, and (outside management) blocks Organizations and Identity Center.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEverythingElse
            Effect: Allow
            Action: "*"
            Resource: "*"
          # Only in accounts where AllowOrganizationsAdmin is "false" (everything except management).
          - !If
              - DenyOrganizations
              - Sid: DenyOrganizationsAndAccount
                Effect: Deny
                Action:
                  - "organizations:*"
                  - "account:*"
                Resource: "*"
              - !Ref AWS::NoValue
          # Only in accounts where AllowIdentityCenterAdmin is "false" (everything except management,
          # where CI applies the identity-center stack). Member accounts never allow it.
          - !If
              - DenyIdentityCenter
              - Sid: DenyIdentityCenter
                Effect: Deny
                Action:
                  - "sso:*"
                  - "sso-directory:*"
                  - "identitystore:*"
                Resource: "*"
              - !Ref AWS::NoValue
          - Sid: DenyOrgDestruction
            Effect: Deny
            Action:
              - "organizations:DeleteOrganization"
              - "organizations:LeaveOrganization"
              - "organizations:CloseAccount"
              - "organizations:RemoveAccountFromOrganization"
            Resource: "*"
          - Sid: DenyCloudTrailChanges
            Effect: Deny
            Action:
              - "cloudtrail:Create*"
              - "cloudtrail:Delete*"
              - "cloudtrail:Update*"
              - "cloudtrail:Put*"
              - "cloudtrail:Stop*"
              - "cloudtrail:RegisterOrganizationDelegatedAdmin"
              - "cloudtrail:DeregisterOrganizationDelegatedAdmin"
            Resource: "*"
          - Sid: DenyEditingThisBoundary
            Effect: Deny
            Action:
              - "iam:CreatePolicyVersion"
              - "iam:DeletePolicy"
              - "iam:DeletePolicyVersion"
              - "iam:SetDefaultPolicyVersion"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/github-actions-apply-boundary"
          - Sid: DenyEditingCiRoles
            Effect: Deny
            Action:
              - "iam:AttachRolePolicy"
              - "iam:DeleteRole"
              - "iam:DeleteRolePermissionsBoundary"
              - "iam:DeleteRolePolicy"
              - "iam:DetachRolePolicy"
              - "iam:PutRolePermissionsBoundary"
              - "iam:PutRolePolicy"
              - "iam:UpdateAssumeRolePolicy"
              - "iam:UpdateRole"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/github-actions-*"
          - Sid: DenyEditingGithubOidcProvider
            Effect: Deny
            Action:
              - "iam:AddClientIDToOpenIDConnectProvider"
              - "iam:DeleteOpenIDConnectProvider"
              - "iam:RemoveClientIDFromOpenIDConnectProvider"
              - "iam:UpdateOpenIDConnectProviderThumbprint"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
          # Tampering with the security services. Enabling and configuring them is fine (PLAN 4.4 applies
          # them from CI); switching them off or removing them is not.
          - Sid: DenySecurityServiceTampering
            Effect: Deny
            Action:
              - "access-analyzer:DeleteAnalyzer"
              - "config:DeleteConfigurationAggregator"
              - "config:DeleteConfigurationRecorder"
              - "config:DeleteDeliveryChannel"
              - "config:StopConfigurationRecorder"
              - "guardduty:DeleteDetector"
              - "guardduty:DisassociateFromAdministratorAccount"
              - "guardduty:DisassociateFromMasterAccount"
              - "guardduty:StopMonitoringMembers"
              - "inspector2:Disable"
              - "macie2:DisableMacie"
              - "securityhub:BatchDisableStandards"
              - "securityhub:DisableSecurityHub"
              - "securityhub:DisassociateFromAdministratorAccount"
            Resource: "*"
          # Roles that belong to the platform, not to a stack: the platform-* and terraform-* roles and the
          # role AWS creates for the management account. (Roles a stack creates must not be named platform-*.)
          - Sid: DenyEditingPlatformRoles
            Effect: Deny
            Action:
              - "iam:AttachRolePolicy"
              - "iam:DeleteRole"
              - "iam:DeleteRolePolicy"
              - "iam:DetachRolePolicy"
              - "iam:PutRolePermissionsBoundary"
              - "iam:PutRolePolicy"
              - "iam:UpdateAssumeRolePolicy"
              - "iam:UpdateRole"
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/platform-*"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/terraform-*"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/OrganizationAccountAccessRole"
          # The workload boundary (governance/account-baseline) must not be deleted or detached from roles. It
          # can still be updated: the baseline stack changes it with CreatePolicyVersion.
          - Sid: DenyDeletingWorkloadBoundary
            Effect: Deny
            Action:
              - "iam:DeletePolicy"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/platform-workload-boundary"
          - Sid: DenyRemovingAnyRoleBoundary
            Effect: Deny
            Action:
              - "iam:DeleteRolePermissionsBoundary"
              - "iam:DeleteUserPermissionsBoundary"
            Resource: "*"
          - Sid: ProtectStateBucket
            Effect: Deny
            Action:
              - "s3:DeleteBucket"
              - "s3:PutBucketPolicy"
              - "s3:DeleteBucketPolicy"
              - "s3:PutBucketVersioning"
              - "s3:PutEncryptionConfiguration"
              - "s3:PutBucketPublicAccessBlock"
              - "s3:PutLifecycleConfiguration"
            Resource: !Sub "arn:aws:s3:::tg-state-${AWS::AccountId}-${AWS::Region}"
          - Sid: ProtectBootstrapStack
            Effect: Deny
            Action:
              - "cloudformation:DeleteStack"
              - "cloudformation:UpdateStack"
              - "cloudformation:UpdateTerminationProtection"
              - "cloudformation:SetStackPolicy"
              - "cloudformation:CreateChangeSet"
              - "cloudformation:ExecuteChangeSet"
            Resource:
              - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/platform-bootstrap/*"
              - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/StackSet-bootstrap-*"

  # ---------------------------------------------------------------------------
  # github-actions-plan: plan / governance / drift jobs (read-only). Trusts any job of the repo
  # (repo:<repo>:*). It cannot change anything, but ReadOnlyAccess can read all state files.
  # ---------------------------------------------------------------------------
  PlanRole:
    Type: AWS::IAM::Role
    Condition: CreateGlobalResources
    Properties:
      RoleName: github-actions-plan
      Description: "GitHub Actions: terragrunt plan (read-only)"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action:
              - "sts:AssumeRoleWithWebIdentity"
              - "sts:TagSession"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubRepo}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: state-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StateBucketList
                Effect: Allow
                Action:
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource: !GetAtt StateBucket.Arn
              - Sid: StateRead
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                Resource: !Sub "${StateBucket.Arn}/*"
              # use_lockfile = true: Terraform creates and deletes <key>.tflock next to the state
              # file. Nothing else in the bucket is writable, so a plan cannot change state.
              - Sid: StateLockWrite
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource: !Sub "${StateBucket.Arn}/*.tflock"

  # ---------------------------------------------------------------------------
  # github-actions-apply: apply / destroy jobs. Trusts exactly one GitHub Environment.
  # ---------------------------------------------------------------------------
  ApplyRole:
    Type: AWS::IAM::Role
    Condition: CreateGlobalResources
    Properties:
      RoleName: github-actions-apply
      Description: "GitHub Actions: terragrunt apply/destroy (one GitHub Environment only)"
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref ApplyBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action:
              - "sts:AssumeRoleWithWebIdentity"
              - "sts:TagSession"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  StateBucketName:
    Description: Terraform state bucket for this account and region
    Value: !Ref StateBucket
  PlanRoleArn:
    Condition: CreateGlobalResources
    Description: Role CI assumes to plan in this account (CI builds the ARN from the account id, no variable needed)
    Value: !GetAtt PlanRole.Arn
  ApplyRoleArn:
    Condition: CreateGlobalResources
    Description: Role CI assumes to apply in this account (only from this account's GitHub Environment)
    Value: !GetAtt ApplyRole.Arn
  OidcProviderArn:
    Condition: CreateGlobalResources
    Description: GitHub OIDC provider in this account
    Value: !Ref GitHubOidcProvider
