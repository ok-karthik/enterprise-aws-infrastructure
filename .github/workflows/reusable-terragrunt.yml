name: 'Reusable Terragrunt Component'

on:
  workflow_call:
    inputs:
      account:
        description: 'Account name from the registry (workloads-dev, management, ...). Used to name jobs and artifacts.'
        required: true
        type: string
      working_directory:
        required: true
        type: string
      aws_plan_role_arn:
        description: 'Read-only github-actions-plan role. Reusable plan/governance jobs never get the apply role.'
        required: true
        type: string
    secrets:
      INFRACOST_API_KEY:
        required: false


env:
  # Use modules from this checkout instead of the pinned release tags (module_versions in env.hcl).
  # Needed until every module has a release tag at the iac-modules-repo path (PLAN 1.4), and later for
  # PRs that change iac-modules-repo/** so module changes are tested before release.
  IAC_MODULES_LOCAL: '1'
  TG_LOG_FORMAT: 'bare'

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  plan:
    name: "📝 Plan: ${{ inputs.account }}"
    runs-on: ubuntu-latest
    outputs:
      # "false" when a PR touches no unit of this account (PLAN 8.5): the governance and cost jobs then skip.
      has_plans: ${{ steps.collect.outputs.has_plans }}
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    env:
      # Real account ids (not secret) from the ACCOUNTS_LOCAL_HCL repository variable; empty on forks.
      ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the affected-units filter compares against origin/<base branch>

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform
        with:
          aws_region: ${{ vars.AWS_REGION }}
          aws_role_arn: ${{ inputs.aws_plan_role_arn }}

      - name: "Disaster Recovery (Smoke Test)"
        run: ./workloads-live-repo/scripts/smoke-test.sh ${{ inputs.working_directory }}

      # PLAN 8.5: a PR plans only the units it changed. Shared code (modules, _envcommon, root.hcl, ...) or any
      # non-PR run plans everything. The scheduled drift-detection run is the full check.
      - name: "Decide plan scope"
        id: scope
        run: python3 workloads-live-repo/scripts/plan_scope.py "${{ github.event_name }}" "${{ github.base_ref }}" | tee -a "$GITHUB_OUTPUT"

      # --out-dir keeps the binary plans (what apply will run, PLAN 8.6); --json-out-dir keeps the readable
      # copies the governance and cost jobs scan.
      - name: "Terragrunt Plan"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/plan-out" "$GITHUB_WORKSPACE/plan-json"
          terragrunt run --all --non-interactive -no-color --log-format bare \
            --out-dir "$GITHUB_WORKSPACE/plan-out" --json-out-dir "$GITHUB_WORKSPACE/plan-json" \
            ${{ steps.scope.outputs.filter }} plan
        working-directory: ${{ inputs.working_directory }}

      - name: "Collect plans"
        id: collect
        run: |
          count=$(find plan-json -name '*.json' | wc -l | tr -d ' ')
          echo "Found $count plan(s) (scope: ${{ steps.scope.outputs.scope }})"
          if [ "$count" -eq 0 ]; then
            if [ "${{ steps.scope.outputs.scope }}" = "full" ]; then
              echo "::error::A full run produced no plans"
              exit 1
            fi
            echo "has_plans=false" >> "$GITHUB_OUTPUT"
            echo "No unit of this account is affected by the PR: nothing to plan."
            exit 0
          fi
          echo "has_plans=true" >> "$GITHUB_OUTPUT"
          # A checksum manifest, so the apply job can prove it applies exactly the plans that were reviewed (PLAN 8.6).
          (cd plan-out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: "Upload Plans"
        if: steps.collect.outputs.has_plans == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "plans-${{ inputs.account }}"
          path: "plan-json/**"
          if-no-files-found: error
          retention-days: 400

      # Binary plans can contain secret values, so they are kept for one day and only on a push to main, where
      # the apply job of the same run needs them.
      - name: "Upload binary plans (for apply)"
        if: steps.collect.outputs.has_plans == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: "planbin-${{ inputs.account }}"
          path: "plan-out/**"
          if-no-files-found: error
          retention-days: 1

  security-governance:
    name: "⚖️ Security & Governance (OPA/Checkov): ${{ inputs.account }}"
    needs: [plan]
    if: needs.plan.outputs.has_plans == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: write
      security-events: write
    env:
      # Real account ids (not secret) from the ACCOUNTS_LOCAL_HCL repository variable; empty on forks.
      ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform

      - name: "Download Plans"
        uses: actions/download-artifact@v8
        with:
          name: "plans-${{ inputs.account }}"
          path: plans

      - name: "OPA Policy Gate (Conftest)"
        run: find plans -name "*.json" -print0 | xargs -0 conftest test --policy policy-library-repo/terraform

      # Every tfplan.json is scanned (like the conftest step above), not just the first one: a plan that is not
      # scanned is a plan that cannot fail. Any finding in any plan fails the step, but all plans are scanned and
      # all findings reported first. Settings come from .checkov.yaml only.
      - name: "Checkov Security Audit (every plan)"
        shell: bash
        run: |
          status=0
          count=0
          mkdir -p checkov-plan-sarif
          while IFS= read -r plan; do
            count=$((count + 1))
            echo "::group::Checkov: $plan"
            # `directory:` in .checkov.yaml makes -f process a plan once per listed directory: each finding is
            # printed (and written) several times. merge_sarif.py drops the duplicates.
            checkov -f "$plan" --framework terraform_plan --config-file .checkov.yaml \
              --output cli --output sarif --output-file-path "console,checkov-plan-sarif/$count" || status=1
            echo "::endgroup::"
          done < <(find plans -name "*.json" | sort)
          if [ "$count" -eq 0 ]; then
            echo "::error::No tfplan.json found to scan"
            exit 1
          fi
          echo "Scanned $count plan(s)"
          python3 workloads-live-repo/scripts/merge_sarif.py checkov-plan-sarif "checkov-results-${{ inputs.account }}.sarif"
          exit $status

      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('checkov-results-{0}.sarif', inputs.account)) != ''
        with:
          sarif_file: "checkov-results-${{ inputs.account }}.sarif"
          category: checkov-plan-${{ inputs.account }}

  cost-analysis:
    name: "💰 Cost Analysis (Infracost): ${{ inputs.account }}"
    needs: [plan]
    if: needs.plan.outputs.has_plans == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    env:
      # Real account ids (not secret) from the ACCOUNTS_LOCAL_HCL repository variable; empty on forks.
      ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform

      - name: "Setup Infracost"
        uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: 0.10.44

      - name: "Download Plans"
        uses: actions/download-artifact@v8
        with:
          name: "plans-${{ inputs.account }}"
          path: plans

      - name: "Generate FinOps Summary"
        run: |
          # 1. Cost Breakdown (CLI only)
          find plans -name "*.json" | while read -r plan; do
            unique_name=$(echo "$plan" | tr '/' '-')
            module_name=$(dirname "$plan" | sed 's|plans/||')
            infracost breakdown --path "$plan" --format json --project-name "$module_name" --out-file "cost-${unique_name}.json"
          done
          infracost output --path "cost-*.json" --format table --out-file /tmp/infracost-table.txt

          # 2. Change Summary (tf-summarize)
          echo "## 📊 Infrastructure Change Summary (${{ inputs.account }})" > /tmp/pr-comment.md
          echo "> 💡 This report summarizes resource changes and estimated cost impact for the **${{ inputs.account }}** account." >> /tmp/pr-comment.md

          find plans -name "*.json" | while read -r plan; do
            module_name=$(dirname $plan | sed 's|plans/||')
            echo "" >> /tmp/pr-comment.md
            echo "<details><summary><b>📂 Module: ${module_name}</b></summary>" >> /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            tf-summarize -md "$plan" >> /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            echo "</details>" >> /tmp/pr-comment.md
          done

          # 3. Append Cost Table
          echo "" >> /tmp/pr-comment.md
          echo "## 💰 Cost Estimate (${{ inputs.account }})" >> /tmp/pr-comment.md
          echo "\`\`\`" >> /tmp/pr-comment.md
          cat /tmp/infracost-table.txt >> /tmp/pr-comment.md
          echo "\`\`\`" >> /tmp/pr-comment.md

      - name: "Post PR Comment"
        if: github.event.pull_request.number != null || github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8');
            const envName = '${{ inputs.account }}';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || ${{ github.event.pull_request.number }},
            });
            const botComment = comments.find(c => c.body.includes(`Infrastructure Change Summary (${envName})`));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number || ${{ github.event.pull_request.number }},
                body: body
              });
            }
