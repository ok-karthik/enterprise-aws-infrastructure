name: 'Reusable Terragrunt Component'

on:
  workflow_call:
    inputs:
      account:
        description: 'Account name from the registry (workloads-dev, management, ...). Used to name jobs and artifacts.'
        required: true
        type: string
      working_directory:
        required: true
        type: string
      aws_plan_role_arn:
        description: 'Read-only github-actions-plan role. Reusable plan/governance jobs never get the apply role.'
        required: true
        type: string
    secrets:
      INFRACOST_API_KEY:
        required: false


env:
  # Use modules from this checkout instead of the pinned release tags (module_versions in env.hcl).
  # Needed until every module has a release tag at the iac-modules-repo path (PLAN 1.4), and later for
  # PRs that change iac-modules-repo/** so module changes are tested before release.
  IAC_MODULES_LOCAL: '1'
  TG_LOG_FORMAT: 'bare'

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  plan:
    name: "📝 Plan: ${{ inputs.account }}"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform
        with:
          aws_region: ${{ vars.AWS_REGION }}
          aws_role_arn: ${{ inputs.aws_plan_role_arn }}

      - name: "Disaster Recovery (Smoke Test)"
        run: ./workloads-live-repo/scripts/smoke-test.sh ${{ inputs.working_directory }}

      - name: "Terragrunt Plan"
        run: |
          # 1. Generate binary plans
          terragrunt run --all plan --non-interactive -no-color --log-format bare -- -out=tfplan.bin

          # 2. Convert to JSON (searching inside .terragrunt-cache)
          echo "🔍 Converting binary plans to JSON..."
          find . -name "tfplan.bin" | while read -r plan_path; do
            dir_path=$(dirname "$plan_path")
            module_path=$(echo "$dir_path" | sed 's/\/\.terragrunt-cache.*//')
            echo "Processing module: $module_path"
            (cd "$dir_path" && terraform show -json tfplan.bin > tfplan.json)
            mv "$dir_path/tfplan.json" "$module_path/tfplan.json"
          done
        working-directory: ${{ inputs.working_directory }}

      - name: "Debug: List Plans"
        run: find ${{ inputs.working_directory }} -name "tfplan.json"

      - name: "Upload Plans"
        uses: actions/upload-artifact@v7
        with:
          name: "plans-${{ inputs.account }}"
          path: "${{ inputs.working_directory }}/**/tfplan.json"
          if-no-files-found: error
          retention-days: 1

  security-governance:
    name: "⚖️ Security & Governance (OPA/Checkov): ${{ inputs.account }}"
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: write
      security-events: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform

      - name: "Download Plans"
        uses: actions/download-artifact@v8
        with:
          name: "plans-${{ inputs.account }}"
          path: plans

      - name: "OPA Policy Gate (Conftest)"
        run: find plans -name "*.json" -print0 | xargs -0 conftest test --policy policy-library-repo/terraform

      # Every tfplan.json is scanned (like the conftest step above), not just the first one: a plan that is not
      # scanned is a plan that cannot fail. Any finding in any plan fails the step, but all plans are scanned and
      # all findings reported first. Settings come from .checkov.yaml only.
      - name: "Checkov Security Audit (every plan)"
        shell: bash
        run: |
          status=0
          count=0
          mkdir -p checkov-plan-sarif
          while IFS= read -r plan; do
            count=$((count + 1))
            echo "::group::Checkov: $plan"
            # `directory:` in .checkov.yaml makes -f process a plan once per listed directory: each finding is
            # printed (and written) several times. merge_sarif.py drops the duplicates.
            checkov -f "$plan" --framework terraform_plan --config-file .checkov.yaml \
              --output cli --output sarif --output-file-path "console,checkov-plan-sarif/$count" || status=1
            echo "::endgroup::"
          done < <(find plans -name "tfplan.json" | sort)
          if [ "$count" -eq 0 ]; then
            echo "::error::No tfplan.json found to scan"
            exit 1
          fi
          echo "Scanned $count plan(s)"
          python3 workloads-live-repo/scripts/merge_sarif.py checkov-plan-sarif "checkov-results-${{ inputs.account }}.sarif"
          exit $status

      - name: Upload Checkov SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('checkov-results-{0}.sarif', inputs.account)) != ''
        with:
          sarif_file: "checkov-results-${{ inputs.account }}.sarif"
          category: checkov-plan-${{ inputs.account }}

      - name: "📂 X-Ray: Verify File Structure"
        run: |
          echo "🔍 Searching for plans..."
          ls -R
          mkdir -p plans/ # Ensure dir exists
          cp .trivyignore plans/.trivyignore || true

      - name: "Trivy Security Scan (Plan)"
        run: |
          PLAN_FILE=$(find plans -name "tfplan.json" | head -n 1)
          echo "🎯 Found Plan File: $PLAN_FILE"

          echo "📡 Generating SARIF for GitHub Security Tab..."
          trivy config "$PLAN_FILE" \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-results-${{ inputs.account }}.sarif \
            --ignorefile plans/.trivyignore

          echo "📊 Printing Table Report and enforcing security gate..."
          trivy config "$PLAN_FILE" --severity CRITICAL,HIGH --ignorefile plans/.trivyignore --format table --exit-code 1

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-results-{0}.sarif', inputs.account)) != ''
        with:
          sarif_file: "trivy-results-${{ inputs.account }}.sarif"
          category: trivy-plan-${{ inputs.account }}

  cost-analysis:
    name: "💰 Cost Analysis (Infracost): ${{ inputs.account }}"
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform

      - name: "Setup Infracost"
        uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: 0.10.44

      - name: "Download Plans"
        uses: actions/download-artifact@v8
        with:
          name: "plans-${{ inputs.account }}"
          path: plans

      - name: "Generate FinOps Summary"
        run: |
          # 1. Cost Breakdown (CLI only)
          find plans -name "tfplan.json" | while read -r plan; do
            unique_name=$(echo "$plan" | tr '/' '-')
            module_name=$(dirname "$plan" | sed 's|plans/||')
            infracost breakdown --path "$plan" --format json --project-name "$module_name" --out-file "cost-${unique_name}.json"
          done
          infracost output --path "cost-*.json" --format table --out-file /tmp/infracost-table.txt

          # 2. Change Summary (tf-summarize)
          echo "## 📊 Infrastructure Change Summary (${{ inputs.account }})" > /tmp/pr-comment.md
          echo "> 💡 This report summarizes resource changes and estimated cost impact for the **${{ inputs.account }}** account." >> /tmp/pr-comment.md

          find plans -name "tfplan.json" | while read -r plan; do
            module_name=$(dirname $plan | sed 's|plans/||')
            echo "" >> /tmp/pr-comment.md
            echo "<details><summary><b>📂 Module: ${module_name}</b></summary>" >> /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            tf-summarize -md "$plan" >> /tmp/pr-comment.md
            echo "" >> /tmp/pr-comment.md
            echo "</details>" >> /tmp/pr-comment.md
          done

          # 3. Append Cost Table
          echo "" >> /tmp/pr-comment.md
          echo "## 💰 Cost Estimate (${{ inputs.account }})" >> /tmp/pr-comment.md
          echo "\`\`\`" >> /tmp/pr-comment.md
          cat /tmp/infracost-table.txt >> /tmp/pr-comment.md
          echo "\`\`\`" >> /tmp/pr-comment.md

      - name: "Post PR Comment"
        if: github.event.pull_request.number != null || github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8');
            const envName = '${{ inputs.account }}';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || ${{ github.event.pull_request.number }},
            });
            const botComment = comments.find(c => c.body.includes(`Infrastructure Change Summary (${envName})`));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number || ${{ github.event.pull_request.number }},
                body: body
              });
            }
