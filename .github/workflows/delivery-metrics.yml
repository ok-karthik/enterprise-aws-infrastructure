name: 'Delivery Metrics (Weekly)'

# PLAN 9.4 / 11.5: lead time, deployment frequency, change failure rate, drift MTTR and the platform SLOs, split into
# human and `ai-generated` PRs. Read-only: it only lists PRs, runs and issues. The result is the job summary and an
# artifact; iac-agents-repo/metrics/platform_slo.json is what the agent's error-budget gate reads when it is fresh.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Days of history to summarise'
        required: false
        default: '28'
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  metrics:
    name: '📈 Delivery metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Compute metrics"
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ inputs.window_days || '28' }}
        run: |
          python3 .github/scripts/delivery_metrics.py \
            --repo "${{ github.repository }}" \
            --window-days "$WINDOW_DAYS" \
            --markdown delivery-metrics.md \
            --write-json iac-agents-repo/metrics/platform_slo.json
          cat delivery-metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload results"
        uses: actions/upload-artifact@v7
        with:
          name: delivery-metrics
          path: |
            delivery-metrics.md
            iac-agents-repo/metrics/platform_slo.json
          retention-days: 30
