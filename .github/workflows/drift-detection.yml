name: 'Drift Detection (Nightly)'

on:
  schedule:
    - cron: '0 6 * * *' # Run daily at 6:00 AM UTC
  workflow_dispatch:      # Allow manual triggering

permissions:
  id-token: write
  contents: read
  issues: write         # Required to create drift alert issues

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Use modules from this checkout instead of the pinned release tags (module_versions in env.hcl).
  # Needed until every module has a release tag at the iac-modules-repo path (PLAN 1.4), and later for
  # PRs that change iac-modules-repo/** so module changes are tested before release.
  IAC_MODULES_LOCAL: '1'
  TG_LOG_FORMAT: 'bare'

jobs:
  # Which accounts to check: generated from the account registry (see terragrunt.yml).
  matrix:
    name: '🧭 Account matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Generate account matrix"
        id: matrix
        run: python3 workloads-live-repo/scripts/generate_account_matrix.py --github-output

  detect-drift:
    name: '🔍 Detect Drift: ${{ matrix.account }}'
    needs: [matrix]
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    timeout-minutes: 30

    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform
        with:
          aws_region: ${{ env.AWS_REGION }}
          aws_role_arn: ${{ matrix.plan_role_arn }}

      - name: "Check for Infrastructure Drift"
        id: plan
        # -detailed-exitcode returns 2 if there are changes (drift)
        run: |
          set +e
          terragrunt run --all plan --non-interactive --log-format bare -- -detailed-exitcode 2>&1 | tee /tmp/drift-plan.txt
          exitcode=${PIPESTATUS[0]}
          set -e

          if [ $exitcode -eq 2 ]; then
            echo "DRIFT_DETECTED=true" >> $GITHUB_ENV
            echo "Drift detected in ${{ matrix.account }}! Exit code 2."
          elif [ $exitcode -ne 0 ]; then
            echo "Error running plan. Exit code $exitcode"
            exit 1
          else
            echo "No drift detected. Infrastructure matches code."
          fi
        working-directory: ${{ matrix.working_directory }}

      - name: "Alert or Resolve Drift Issue"
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.account }}';
            const title = `🚨 Infrastructure Drift Detected: ${env}`;
            const driftDetected = process.env.DRIFT_DETECTED === 'true';

            // Read plan diff if available
            let planDiff = '';
            try {
              if (fs.existsSync('/tmp/drift-plan.txt')) {
                const raw = fs.readFileSync('/tmp/drift-plan.txt', 'utf8');
                planDiff = raw.length > 5000 ? raw.slice(0, 5000) + '\n... [truncated]' : raw;
              }
            } catch (e) {
              console.log('Error reading /tmp/drift-plan.txt:', e);
            }
            const planBlock = planDiff ? `\n\n### 📋 Drift Plan Output\n\`\`\`diff\n${planDiff}\n\`\`\`` : '';

            // 1. Search for existing open issues with this title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift'
            });

            const existingIssue = issues.find(i => i.title === title);

            if (driftDetected) {
              if (existingIssue) {
                console.log(`An open drift issue already exists for ${env}: #${existingIssue.number}. Updating with persistence comment.`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `🔍 **Update**: Drift is still detected in \`${env}\` as of ${new Date().toUTCString()}. Please remediate as soon as possible.${planBlock}`
                });
              } else {
                console.log(`No open drift issue found for ${env}. Creating new one.`);
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: `The nightly drift detection workflow found that the live infrastructure in \`${env}\` does not match the Terraform state/code.\n\nPlease review the [Action Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to see the exact resources that have drifted and remediate immediately.${planBlock}\n\n🤖 **Automated Remediation**: Comment \`/reconcile remediate ${env} drift\` on this issue to trigger the IaC Platform Agent to propose a corrective Pull Request.`,
                  labels: ["bug", "security", "drift", env]
                });
              }
            } else {
              // Drift is NOT detected (success case)
              if (existingIssue) {
                console.log(`Drift resolved for ${env}! Closing issue #${existingIssue.number}.`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `✅ **Resolved**: The latest drift detection run confirmed that the infrastructure in \`${env}\` is now back in sync with the code. Closing this issue automatically.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'closed'
                });
              } else {
                console.log(`No drift detected in ${env} and no open issues to close. All good!`);
              }
            }
