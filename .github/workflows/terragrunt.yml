name: 'Terragrunt CI/CD'
# Trigger jumpstart: 2026-04-23

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target_region:
        description: 'Target AWS Region (Overrides vars.AWS_REGION if provided)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write
  security-events: write

env:
  AWS_REGION: ${{ github.event.inputs.target_region || vars.AWS_REGION }}
  # Use modules from this checkout instead of the pinned release tags (module_versions in env.hcl).
  # Needed until every module has a release tag at the iac-modules-repo path (PLAN 1.4), and later for
  # PRs that change iac-modules-repo/** so module changes are tested before release.
  IAC_MODULES_LOCAL: '1'
  TG_LOG_FORMAT: 'bare'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Gate 1: High-Speed Static Analysis (TFLint/Checkov)
  # ─────────────────────────────────────────────────────────────
  static-analysis:
    name: '🔍 Static Analysis (TFLint/Checkov)'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    env:
      # Real account ids (not secret) from the ACCOUNTS_LOCAL_HCL repository variable; empty on forks.
      ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform

      - name: "Static Analysis"
        uses: ./.github/actions/static-analysis


  # ─────────────────────────────────────────────────────────────
  # Account matrix: which accounts does the pipeline run for?
  # Generated from foundation-live-repo/_config/accounts.hcl (ci = true, a live folder and a real
  # account id). Placeholders are skipped with a notice, never a red build.
  # ─────────────────────────────────────────────────────────────
  matrix:
    name: '🧭 Account matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Generate account matrix"
        id: matrix
        env:
          ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
        run: python3 workloads-live-repo/scripts/generate_account_matrix.py --github-output

  # ─────────────────────────────────────────────────────────────
  # Gate 2-4: plan, governance and cost per account (Reusable)
  # Each job assumes github-actions-plan in its own account directly over OIDC (no role chaining, no
  # per-environment role variables): arn:aws:iam::<account-id>:role/github-actions-plan.
  # ─────────────────────────────────────────────────────────────
  stack:
    name: '${{ matrix.account }}'
    needs: [matrix]
    if: needs.matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    uses: ./.github/workflows/reusable-terragrunt.yml
    with:
      account: ${{ matrix.account }}
      working_directory: ${{ matrix.working_directory }}
      aws_plan_role_arn: ${{ matrix.plan_role_arn }}
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  # ─────────────────────────────────────────────────────────────
  # Deployment (Compliance-First Promotion)
  # One job per account, one at a time, in this order: management, core, dev, staging, prod. It only
  # starts after EVERY account's plan and governance checks passed, and it stops at the first failure.
  # Each job runs in the account's GitHub Environment (manual approval where it is configured, e.g.
  # prod) and assumes github-actions-apply, which only trusts that one Environment.
  # ─────────────────────────────────────────────────────────────
  apply:
    name: '🚀 Apply: ${{ matrix.account }}'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.matrix.outputs.count != '0'
    needs: [matrix, stack]
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    environment: ${{ matrix.github_environment }}
    env:
      # Real account ids (not secret) from the ACCOUNTS_LOCAL_HCL repository variable; empty on forks.
      ACCOUNTS_LOCAL_HCL: ${{ vars.ACCOUNTS_LOCAL_HCL }}
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v6

      - name: "Setup Platform"
        uses: ./.github/actions/setup-platform
        with:
          aws_region: ${{ env.AWS_REGION }}
          aws_role_arn: ${{ matrix.apply_role_arn }}

      # PLAN 8.6: apply exactly the plans the "stack" job made for this commit (the ones the approver reviewed),
      # never a fresh plan. A missing artifact or a checksum mismatch stops the job; there is no fallback to
      # planning again. If state changed since the plan, Terraform refuses the stale plan and the run must be repeated.
      - name: "Download reviewed plans"
        uses: actions/download-artifact@v8
        with:
          name: "planbin-${{ matrix.account }}"
          path: plan-out

      - name: "Verify plan checksums"
        run: cd plan-out && sha256sum --check --strict SHA256SUMS

      - name: "Terragrunt Apply (saved plans)"
        run: terragrunt run --all --non-interactive --log-format bare --out-dir "$GITHUB_WORKSPACE/plan-out" apply -auto-approve
        working-directory: ${{ matrix.working_directory }}
