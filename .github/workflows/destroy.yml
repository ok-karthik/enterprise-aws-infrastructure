name: 'Terragrunt Teardown (Manual)'

# This workflow takes manual inputs for account selection and safety confirmation.
# Slating Checkov CKV_GHA_7 as a skip because inputs are required for surgical teardown.
# checkov:skip=CKV_GHA_7: Manual inputs are required for account selection and safety confirmation.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Account to destroy, as named in the account registry (e.g. workloads-dev). Not management.'
        required: true
        default: 'workloads-dev'
        type: string
      confirm_destruction:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  contents: read      # Minimum required
  id-token: write      # Required for OIDC AWS authentication

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Use modules from this checkout instead of the pinned release tags (module_versions in env.hcl).
  # Needed until every module has a release tag at the iac-modules-repo path (PLAN 1.4), and later for
  # PRs that change iac-modules-repo/** so module changes are tested before release.
  IAC_MODULES_LOCAL: '1'
  TG_LOG_FORMAT: 'bare'

jobs:
  discover:
    name: '🔍 Discover Account'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      working_directory: ${{ steps.account.outputs.working_directory }}
      github_environment: ${{ steps.account.outputs.github_environment }}
      apply_role_arn: ${{ steps.account.outputs.apply_role_arn }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Resolve account from the registry
        id: account
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          # The management account holds the organization and the Day-0 bootstrap: it is never torn
          # down from CI (the organization has prevent_destroy, and the apply boundary denies it).
          if [ "$ACCOUNT" = "management" ]; then
            echo "::error::The management account cannot be destroyed from CI."
            exit 1
          fi
          # Fails unless the account is in the CI matrix (ci = true, a live folder, a real account id).
          python3 workloads-live-repo/scripts/generate_account_matrix.py --account "$ACCOUNT" --github-output

  destroy:
    name: '🌪️ Destroy: ${{ github.event.inputs.account }}'
    needs: [discover]
    if: github.event.inputs.confirm_destruction == 'DESTROY'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ok-karthik/infrastructure-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 40
    # The account's GitHub Environment: it holds the approval, and github-actions-apply only trusts it.
    environment: ${{ needs.discover.outputs.github_environment }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Setup Platform
        uses: ./.github/actions/setup-platform
        with:
          aws_region: ${{ env.AWS_REGION }}
          aws_role_arn: ${{ needs.discover.outputs.apply_role_arn }}

      - name: Terragrunt Destroy (Sequential)
        run: |
          # Terragrunt 1.x uses 'run --all' and '--non-interactive'
          terragrunt run --all destroy --non-interactive -auto-approve --log-format bare
        working-directory: ${{ needs.discover.outputs.working_directory }}
