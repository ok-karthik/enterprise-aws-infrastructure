name: 'Static Analysis'
description: 'Runs HCL formatting, validation, TFLint, and Checkov scans'

runs:
  using: 'composite'
  steps:
    - name: Check HCL Formatting
      shell: bash
      run: |
        echo "🎨 Checking HCL formatting..."
        terraform fmt -check -recursive iac-modules-repo
        terraform fmt -check -recursive infrastructure-live
        terraform fmt -check -recursive policies

    - name: Terraform Validate
      shell: bash
      run: |
        echo "✅ Validating Terraform modules..."
        find iac-modules-repo -maxdepth 2 -name "main.tf" -exec sh -c 'cd $(dirname {}) && terraform init -backend=false && terraform validate' \;

    - name: Unit Tests (Rego policies + module guardrails)
      shell: bash
      run: |
        echo "🧪 Running policy unit tests..."
        conftest verify --policy policies/terraform

        echo "🧪 Running module unit tests (mock provider, no AWS credentials)..."
        for tests_dir in iac-modules-repo/*/*/tests; do
          [ -d "$tests_dir" ] || continue
          module_dir=$(dirname "$tests_dir")
          echo "→ $module_dir"
          (cd "$module_dir" && terraform init -backend=false -input=false >/dev/null && terraform test)
        done

    - name: CloudFormation Lint (Day-0 bootstrap template)
      shell: bash
      run: |
        echo "☁️ Linting CloudFormation templates..."
        pip3 install --quiet --no-cache-dir --break-system-packages cfn-lint
        cfn-lint infrastructure-bootstrap/cloudformation/*.yaml

    - name: Run TFLint
      shell: bash
      run: |
        echo "🔍 Running TFLint..."
        tflint --init
        tflint --chdir=iac-modules-repo --recursive --format=compact
        tflint --chdir=infrastructure-live --recursive --format=compact
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run Checkov (Static HCL)
      uses: bridgecrewio/checkov-action@v12
      with:
        config_file: .checkov.yaml
        soft_fail: true
        output_format: sarif
        output_file_path: checkov-results.sarif
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload Checkov SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('checkov-results.sarif') != ''
      with:
        sarif_file: checkov-results.sarif
        category: static-analysis-checkov

    - name: Run Trivy Scan (Security)
      shell: bash
      run: |
        echo "🛡️ Running Trivy scan (SARIF)..."
        trivy config . \
          --severity CRITICAL,HIGH \
          --format sarif \
          --output trivy-results.sarif \
          --ignorefile .trivyignore \
          --tf-exclude-downloaded-modules

        echo "📊 Printing Table Report and enforcing security gate..."
        trivy config . --severity CRITICAL,HIGH --ignorefile .trivyignore --format table --tf-exclude-downloaded-modules --exit-code 1

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: trivy-results.sarif
        category: static-analysis-trivy

    - name: License Compliance Check
      shell: bash
      run: |
        echo "📜 Checking license compliance..."
        ./infrastructure-live/scripts/check-licenses.sh
