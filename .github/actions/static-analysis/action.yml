name: 'Static Analysis'
description: 'Runs HCL formatting, validation, TFLint, and Checkov scans'

runs:
  using: 'composite'
  steps:
    - name: Check HCL Formatting
      shell: bash
      run: |
        echo "🎨 Checking HCL formatting..."
        terraform fmt -check -recursive iac-modules-repo
        terraform fmt -check -recursive foundation-live-repo
        terraform fmt -check -recursive workloads-live-repo
        terraform fmt -check -recursive policy-library-repo

    - name: Terraform Validate
      shell: bash
      run: |
        echo "✅ Validating Terraform modules..."
        find iac-modules-repo -maxdepth 2 -name "main.tf" -exec sh -c 'cd $(dirname {}) && terraform init -backend=false && terraform validate' \;

    - name: Unit Tests (Rego policies + module guardrails)
      shell: bash
      run: |
        echo "🧪 Running policy unit tests..."
        conftest verify --policy policy-library-repo/terraform

        echo "🧪 Running module unit tests (mock provider, no AWS credentials)..."
        for tests_dir in iac-modules-repo/*/*/tests; do
          [ -d "$tests_dir" ] || continue
          module_dir=$(dirname "$tests_dir")
          echo "→ $module_dir"
          (cd "$module_dir" && terraform init -backend=false -input=false >/dev/null && terraform test)
        done

    - name: CloudFormation Lint (Day-0 bootstrap template)
      shell: bash
      run: |
        echo "☁️ Linting CloudFormation templates..."
        pip3 install --quiet --no-cache-dir --break-system-packages cfn-lint
        cfn-lint foundation-live-repo/_bootstrap/cloudformation/*.yaml

    - name: Bootstrap template tests (apply boundary and CI roles)
      shell: bash
      run: python3 -m unittest discover -s foundation-live-repo/_bootstrap/tests

    - name: Script unit tests (account matrix generator)
      shell: bash
      run: python3 -m unittest discover -s workloads-live-repo/scripts/tests

    - name: Account registry check
      shell: bash
      run: ./workloads-live-repo/scripts/check-account-registry.sh

    - name: Run TFLint
      shell: bash
      run: |
        echo "🔍 Running TFLint..."
        tflint --init
        tflint --chdir=iac-modules-repo --recursive --format=compact
        tflint --chdir=foundation-live-repo --recursive --format=compact
        tflint --chdir=workloads-live-repo --recursive --format=compact
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # Checkov runs through the same script as the pre-commit hook and `make checkov`, so a finding that fails here
    # fails locally too. Settings live only in .checkov.yaml; this step adds only the output format. Any finding
    # fails the job (no soft-fail), and it is the same result the "Checkov" code-scanning check reports.
    - name: Run Checkov (Static HCL)
      shell: bash
      run: |
        ./workloads-live-repo/scripts/run-checkov.sh \
          --output cli --output sarif --output-file-path console,checkov-results-raw.sarif

    - name: Filter suppressed findings from Checkov SARIF
      shell: bash
      if: always() && hashFiles('checkov-results-raw.sarif') != ''
      run: |
        python3 workloads-live-repo/scripts/merge_sarif.py checkov-results-raw.sarif checkov-results.sarif

    - name: Upload Checkov SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('checkov-results.sarif') != ''
      with:
        sarif_file: checkov-results.sarif
        category: static-analysis-checkov

    - name: Run Trivy Scan (Security)
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        echo "🛡️ Running Trivy scan (SARIF)..."
        trivy config . \
          --severity CRITICAL,HIGH \
          --format sarif \
          --output trivy-results.sarif \
          --ignorefile .trivyignore \
          --tf-exclude-downloaded-modules

        echo "📊 Printing Table Report and enforcing security gate..."
        trivy config . --severity CRITICAL,HIGH --ignorefile .trivyignore --format table --tf-exclude-downloaded-modules --exit-code 1

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: trivy-results.sarif
        category: static-analysis-trivy

    - name: License Compliance Check
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        echo "📜 Checking license compliance..."
        ./workloads-live-repo/scripts/check-licenses.sh
